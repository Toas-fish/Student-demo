};

const CARDS = [
  { 
    label: { en: "Did Su Dongpo really invent braised pork?", zh: "红烧肉（东坡肉）真的是苏东坡发明的吗？" }, 
    cls: "card-1", 
    aiText: { 
      en: "Braised pork is universally acknowledged to have been invented by Su Dongpo. In the Yuanfeng era of the Northern Song, Su was exiled to Huangzhou... He wrote 'Ode to Pork' to record his insights. One could say that without Su Dongpo, there would be no braised pork in the sense we know today.", 
      zh: "红烧肉公认是苏东坡发明的。北宋元丰年间，苏东坡被贬黄州，生活清苦，他便亲自琢磨烹肉之法，以慢火少水久炖，使猪肉酥烂入味，并写下《猪肉颂》记录心得。可以说，没有苏东坡，就没有今天意义上的红烧肉。" 
    }, 
    historyText: { 
      en: "[What's wrong]\nThe recipe for braised pork is already fully recorded in the Northern Wei Qimin Yaoshu, far earlier than the Song. The name 'Dongpo pork' does not appear until the Ming Dynasty. Su Dongpo's own method was actually boiled pork.\n\n[Sources]\n1. Qimin Yaoshu · Zhenfou (Northern Wei)\n2. Su Shi, 'Ode to Pork'\n3. China News Service report (He Hong's research)", 
      zh: "【哪里有问题】\n红烧肉做法在北魏《齐民要术》中已有完整记载，远早于宋代。“东坡肉”之名要到明代文献才出现。值得一提的是苏东坡当年的做法其实是白煮肉。\n\n【史料出处】\n1. 《齐民要术·蒸缶》（北魏，最早记录）\n2. 苏轼《猪肉颂》\n3. 中新网报道（何宏考证结论）" 
    } 
  },
  { 
    label: { en: "Did Tang people commonly use iron woks?", zh: "唐朝人已经普遍使用铁锅炒菜了吗？" }, 
    cls: "card-2", 
    aiText: { 
      en: "Tang Dynasty people already commonly used iron woks for stir-frying. Tang metallurgy was highly developed and iron output rose sharply, so iron woks entered every household. One could say that the spread of iron woks was the key to the leap in Tang cooking standards.", 
      zh: "唐朝人已经普遍使用铁锅炒菜。唐代冶铁业高度发达，铁产量大幅提升，铁锅随之走进千家万户。可以说，铁锅的普及是唐代烹饪水平跃升的关键，炒菜也正是从唐代开始成为中式烹饪的主流。" 
    }, 
    historyText: { 
      en: "[What's wrong]\nIron woks only truly spread to ordinary households in the Song; Tang cooking still centered on boiling, roasting and steaming. The cited article from Science China Popularization cannot be found.\n\n[Sources]\n1. Beijing Youth Daily article on Song oil-pressing technology\n2. Archaeological Discussion of Ironware in the Sui-Tang Period", 
      zh: "【哪里有问题】\n唐代冶铁确有进步，但“普遍使用”是夸大。铁锅真正普及到普通百姓家要到宋代。唐代烹饪仍以煮、烤、蒸为主。且AI承认检索不到其声称的科普中国文章。\n\n【史料出处】\n1. 北京青年报文章（指出炒菜流行于宋朝）\n2. 《隋唐时期铁器与铁器工业的考古学论述》（证明存在消费分层）" 
    } 
  },
  { 
    label: { en: "Is hubing the same as modern pizza?", zh: "胡饼就是现在的披萨吗？" }, 
    cls: "card-3", 
    aiText: { 
      en: "Hubing is essentially the ancient pizza. In Tang Chang'an, hubing shops lined the streets, and the method was to cover the flatbread with mutton, pepper, butter and other toppings and bake it, almost identical to today's pizza.", 
      zh: "胡饼其实就是古代的披萨。唐代长安胡饼店林立，做法是在面饼上铺满羊肉、胡椒、酥油等馅料烤制，与今天的披萨几乎一模一样。学界有一种说法认为，披萨的源头就是中国的胡饼。" 
    }, 
    historyText: { 
      en: "[What's wrong]\nThe most typical form of hubing is a baked flatbread sprinkled with sesame, closer to naan. 'Pizza originated from hubing' has no reliable historical support.\n\n[Sources]\n1. Tang Yulin, 'Gulouzi' (shows it was a wealthy variant)\n2. Bowu magazine (states pizza is native to Italy)", 
      zh: "【哪里有问题】\n胡饼最典型形态是撒芝麻的烤面饼，更接近馕或烧饼。“铺满馅料烤制”只是唐代一种富贵变体。披萨源自胡饼没有任何可靠史料支撑，属现代谣言。\n\n【史料出处】\n1. 《唐语林》“古楼子”（“豪家”特供，非胡饼常态）\n2. 《博物》杂志（比萨为意大利本土食物）" 
    } 
  },
  { 
    label: { en: "Roast duck in Along the River?", zh: "《清明上河图》里画了烤鸭吗？" }, 
    cls: "card-4", 
    aiText: { 
      en: "The painting vividly records the food scene of Song Bianjing. It is full of taverns and eateries, with roast duck stalls, showing that Song people already ate roast duck. This painting is an encyclopedia of Song food culture.", 
      zh: "《清明上河图》生动记录了宋代汴京的饮食盛况。画中酒楼林立、食肆遍布，烤鸭摊、面食铺一应俱全，说明宋代人已经开始吃烤鸭。可以说，这幅画就是一部宋代饮食文化的百科全书。" 
    }, 
    historyText: { 
      en: "[What's wrong]\nMost eateries in the painting are simple, similar to today's food stalls, selling fast food like minced-meat soup and fried duck. There were no 'roast duck stalls'. AI conflated the food stalls with high-end taverns.\n\n[Sources]\n1. People's Daily Online research article (details the simple stalls and dishes like 'fried duck')\n2. The original painting.", 
      zh: "【哪里有问题】\n画中食店多设施简陋，类似大排档，卖撺肉羹、煎鸭子等家常快餐，没有“烤鸭摊”。AI把“大排档”和“高档正店”混在一起，还把“煎鸭子”说成“烤鸭”。\n\n【史料出处】\n1. 人民网转载考据文章（指明是简陋大排档及“煎鸭子”等菜式）\n2. 原画（故宫博物院数字文物库）" 
    } 
  },
  { 
    label: { en: "Did the 'Eight Big Bowls' originate in the Ming court?", zh: "八大碗起源于明朝宫廷吗？" }, 
    cls: "card-5", 
    aiText: { 
      en: "The Eight Big Bowls originated in the Ming court. They were the banquet format established when Ming emperors feasted their ministers, symbolizing 'eight directions paying tribute'. Later this court banquet form spread to the people.", 
      zh: "八大碗起源于明朝宫廷，是明代皇帝宴请群臣时定下的宴席规制。后来这一宫廷宴席形式流入民间，被各地婚丧嫁娶所沿用，承载着明代宫廷礼仪文化向民间下沉的历史脉络。" 
    }, 
    historyText: { 
      en: "[What's wrong]\nThe Eight Big Bowls are essentially a general term for folk 'flowing banquets'. Because tables and bowls were insufficient, people adopted a 'come and eat, finish and go' approach. It has no direct lineage with the Ming court.\n\n[Sources]\n1. No primary-source support for the Ming court claim.\n2. China News Service reprint of Beijing Morning Post (derived from Beijing Local Gazetteer).", 
      zh: "【哪里有问题】\n八大碗本质是民间流水席的统称。因桌椅碗筷不够而“随来随吃、吃完即走”。它和“明朝宫廷”没有直接源流关系。\n\n【史料出处】\n1. “起源于明朝宫廷”没有一手文献支撑。\n2. 中新网转载《北京晨报》（引《北京地方志·人民生活志》）" 
    } 
  }
];

function toggleLanguage() {

  document.getElementById('txt-subtitle').textContent = t.subtitle;

  document.getElementById('txt-back1').textContent = t.back;
  document.getElementById('txt-back2').textContent = t.back;
  document.getElementById('txt-aiTitle').textContent = t.aiTitle;
  document.getElementById('txt-histTitle').textContent = t.histTitle;
  document.getElementById('txt-searchBtn2').textContent = t.searchBtn2;
  document.getElementById('txt-aiPanel').textContent = t.aiPanel;
  document.getElementById('txt-doubt').textContent = t.doubt;
  document.getElementById('txt-geminiBtn').textContent = t.geminiBtn;
  document.getElementById('txt-realSearch').textContent = t.realSearch;
  document.getElementById('txt-status1').textContent = t.status1;
  document.getElementById('txt-status2').textContent = t.status2;
  document.getElementById('txt-suggest').textContent = t.suggest;
  document.getElementById('searchInput').placeholder = t.placeholder;
  renderCards();
if (document.getElementById('page-detail').classList.contains('active')) {
    const currentCoverClass = document.getElementById('miniCover').className.replace('mini-cover ', '');
    const currentIndex = CARDS.findIndex(c => c.cls === currentCoverClass);
    if (currentIndex !== -1) {
      document.getElementById('miniQuestion').textContent = CARDS[currentIndex].label[currentLang];
    }
  }
}
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const targetPage = document.getElementById(id);
  targetPage.classList.add('active');
  setTimeout(() => { targetPage.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 10);
}

function renderCards() {
  const track = document.getElementById('carouselTrack');
  const all = [...CARDS, ...CARDS];
  track.innerHTML = all.map((c, i) => `
    <div class="food-card ${c.cls}" data-index="${i % CARDS.length}">
      <div class="placeholder"></div>
      <div class="card-label">${c.label[currentLang]}</div>
    </div>
  `).join('');
}

function openDetail(index) {
  const c = CARDS[index];
  document.getElementById('aiDetailText').textContent = c.aiText[currentLang];
  document.getElementById('historyDetailText').textContent = c.historyText[currentLang];
  
  const mini = document.getElementById('miniCover');
  mini.className = 'mini-cover ' + c.cls;
  mini.innerHTML = '<div class="placeholder"></div>';
  
  mini.querySelector('.placeholder').style.backgroundImage = `url('${index + 1}.jpg')`;
  mini.querySelector('.placeholder').style.backgroundSize = 'cover';
  mini.querySelector('.placeholder').style.backgroundPosition = 'center';
  
  document.getElementById('miniQuestion').textContent = c.label[currentLang];
  
  showPage('page-detail');
}
document.getElementById('carouselTrack').addEventListener('click', function(e) {
  const card = e.target.closest('.food-card');
  if (!card) return;
  const idx = card.getAttribute('data-index');
  if (idx !== null) openDetail(parseInt(idx, 10));
});

function goToSearchPage() {
  showPage('page-search');
  setTimeout(() => { document.getElementById('searchInput').focus(); }, 400);
}

function doSearch() {
  const kw = document.getElementById('searchInput').value.trim();
  if (!kw) return;
  performSearch(kw);
}

let typeTimer = null;

function performSearch(kw) {
  const stopWords = /\b(the|a|an|is|are|was|were|what|how|why|of|in|on|to|for|with|about|do|does|did|can|could|and|or|not|this|that|these|those)\b/gi;
  const stopWordsZh = /(的|了|是|我|想|找|了解|请问|关于|有哪些|什么|怎么|如何|介绍|一下)/g;

  let cleanKw = kw.replace(/[.,!?;:'"()\[\]{}\+\-_\s，。！？、；：“”‘’（）《》【】]/g, ' ');
  cleanKw = cleanKw.replace(stopWords, ' ');
  cleanKw = cleanKw.replace(stopWordsZh, ' ');
  cleanKw = cleanKw.replace(/\s+/g, ' ').trim().toLowerCase();

  const googleUrl = 'https://www.google.com/search?q=' + encodeURIComponent(cleanKw);
  const t = UI_TEXT[currentLang];

  const status = document.getElementById('searchStatus');
  status.innerHTML = `
    <p>${t.resultKw}</p>
    <div class="kw-highlight">${cleanKw}</div>
    <p class="tip">${t.resultTip}</p>
    <a href="${googleUrl}" target="_blank" class="btn-google" style="width:100%;">${t.googleBtn}</a>
  `;

  let aiAnswer = "";
  let matched = false;

  for (const key in AI_DATABASE) {
    const item = AI_DATABASE[key];
    
    if (cleanKw.includes(key.toLowerCase())) {
      aiAnswer = item.answer[currentLang];
      matched = true;
      break;
    }

    if (!matched && item.keywords) {
      const allKeywords = [...(item.keywords.zh || []), ...(item.keywords.en || [])];
      
      for (let i = 0; i < allKeywords.length; i++) {
        const word = allKeywords[i].toLowerCase();
        if (cleanKw.includes(word) || word.includes(cleanKw)) {
          aiAnswer = item.answer[currentLang];
          matched = true;
          break;
        }
      }
      if (matched) break;
    }
  }

  if (!matched) {
    aiAnswer = currentLang === 'zh' 
      ? "关于这个问题，我掌握的资料有限，请去 Google 搜索验证。" 
      : "Regarding this, I have limited information. Please search Google.";
  }

  const aiOutputEl = document.getElementById('aiOutput');
  typeText(aiOutputEl, aiAnswer);
}

function typeText(el, text) {
  if (typeTimer) clearInterval(typeTimer);
  el.innerHTML = '<span class="cursor"></span>';
  let i = 0;
  typeTimer = setInterval(() => {
    if (i >= text.length) {
      clearInterval(typeTimer);
      el.innerHTML = text.replace(/\n/g, '<br>');
      return;
    }
    i++;
    el.innerHTML = text.slice(0, i).replace(/\n/g, '<br>') + '<span class="cursor"></span>';
  }, 18);
}
renderCards();
